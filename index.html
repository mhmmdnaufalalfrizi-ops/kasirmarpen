<style>

</style></head><body>
<main id="v"></main><nav id="nav"></nav><div id="ov" class="ov" hidden></div>
<script>
const $=s=>document.querySelector(s),R=n=>'Rp'+Math.round(n).toLocaleString('id-ID'),N=n=>(+n||0).toLocaleString('id-ID',{maximumFractionDigits:3}),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const seed=()=>({products:[{id:1,name:'Kopi Susu',barcode:'8990001',cat:'Minuman',unit:'pcs',price:15000,cost:8000,stock:50,exp:'',tiers:''},{id:2,name:'Beras',barcode:'8990002',cat:'Sembako',unit:'kg',price:14000,cost:11500,stock:120,exp:'',tiers:'10:13000'},{id:3,name:'Roti Tawar',barcode:'8990003',cat:'Makanan',unit:'pcs',price:16000,cost:11000,stock:8,exp:new Date(Date.now()+4*864e5).toISOString().slice(0,10),tiers:''}],customers:[],sales:[],expenses:[],stockLog:[],shifts:[],shift:null,set:{store:'Toko Saya',addr:'Alamat toko',taxOn:true,tax:11,methods:['Tunai','Transfer','QRIS'],pin:''}});
let db;try{db=JSON.parse(localStorage.getItem('kasir'))||seed()}catch(e){db=seed()}
const save=()=>{try{localStorage.setItem('kasir',JSON.stringify(db))}catch(e){}};
const P=id=>db.products.find(p=>p.id==id),C=id=>db.customers.find(c=>c.id==id),nid=()=>Date.now()+Math.floor(Math.random()*999);
let tab='kasir',cart=[],tdisc=0,tdt='rp',ship=0,cust='',q='',rp='30';
const tabs=[['kasir','Kasir'],['produk','Produk'],['cust','Pelanggan'],['biaya','Biaya'],['lap','Laporan'],['sup','Supplier'],['promo','Promo'],['pre','Pre-Order'],['set','Setelan']];
function go(t){tab=t;draw()}
function draw(){$('#nav').innerHTML=tabs.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');$('#v').innerHTML=({kasir:vKasir,produk:vProduk,cust:vCust,biaya:vBiaya,lap:vLap,set:vSet,sup:vSup,promo:vPromo,pre:vPre})[tab]();if(tab=='kasir'&&innerWidth>900&&$('#ov').hidden&&$('#q'))$('#q').focus()}
function modal(h){const o=$('#ov');o.innerHTML='<div>'+h+'</div>';o.hidden=false}function closeM(){$('#ov').hidden=true;stopCam()}
function form(title,fs,cb,extra=''){modal(`<h3>${title}</h3>`+fs.map(f=>`<label>${f[1]}<input id="f_${f[0]}" ${f[2]||''} value="${E(f[3])}"></label>`).join('')+extra+`<div class="row"><button class="ghost" onclick="closeM()">Batal</button><button onclick="formOk()">Simpan</button></div>`);window.formOk=()=>{const v={};fs.forEach(f=>v[f[0]]=$('#f_'+f[0]).value);closeM();cb(v)}}
/* ===== KASIR ===== */
function price(p,qty){let pr=+p.price;(p.tiers||'').split(',').filter(Boolean).map(s=>s.split(':').map(Number)).sort((a,b)=>b[0]-a[0]).some(([m,h])=>qty>=m&&(pr=h,1));const cu=C(cust);if(cu&&cu.special&&cu.special[p.id])pr=cu.special[p.id];return pr}
function line(c){const p=P(c.pid),g=price(p,c.qty)*c.qty;return g-(c.dt=='%'?g*c.d/100:+c.d)}
function calc(){const sub=cart.reduce((s,c)=>s+line(c),0),td=(tdt=='%'?sub*tdisc/100:+tdisc)+promoD(sub),base=Math.max(0,sub-td),tax=db.set.taxOn?base*db.set.tax/100:0;return{sub,td,tax,total:base+tax+(+ship||0)}}
function add(id,qty=1){const c=cart.find(c=>c.pid==id);c?c.qty+=qty:cart.push({pid:id,qty,d:0,dt:'rp'});draw()}
function scan(v){v=v.trim();if(!v)return;const p=db.products.find(p=>p.barcode==v)||db.products.find(p=>p.name.toLowerCase()==v.toLowerCase());p?(q='',add(p.id)):(q=v,draw())}
function vKasir(){const list=db.products.filter(p=>!q||(p.name+p.barcode+p.cat).toLowerCase().includes(q.toLowerCase())),t=calc();
return `<div class="two"><div><div class="row"><input id="q" placeholder="Scan barcode / cari produk" value="${E(q)}" onkeydown="if(event.key=='Enter')scan(this.value)" oninput="q=this.value;clearTimeout(window.tq);window.tq=setTimeout(()=>{draw();$('#q').focus()},300)"><button class="fit" onclick="cam()">Kamera</button></div><div class="grid">${list.map(p=>`<button class="p" onclick="add(${p.id})"><b>${E(p.name)}</b><span class="mut">${R(p.price)}/${E(p.unit)}</span><span class="mut" style="color:${p.stock<=5?'var(--bad)':''}">Stok ${N(p.stock)}</span></button>`).join('')||'<p class="mut">Produk tidak ditemukan.</p>'}</div></div>
<div class="card"><h3>Keranjang</h3>${cart.map((c,i)=>{const p=P(c.pid);return `<div style="border-bottom:1px solid var(--line);padding:6px 0"><div class="row sp"><b>${E(p.name)}</b><span class="fit">${R(line(c))}</span><button class="fit sm bad" onclick="cart.splice(${i},1);draw()">×</button></div><div class="row"><input type="number" step="any" value="${c.qty}" onchange="cart[${i}].qty=+this.value||0;draw()"><input type="number" placeholder="Diskon" value="${c.d||''}" onchange="cart[${i}].d=+this.value;draw()"><select class="fit" style="width:64px" onchange="cart[${i}].dt=this.value;draw()"><option value="rp" ${c.dt=='rp'?'selected':''}>Rp</option><option value="%" ${c.dt=='%'?'selected':''}>%</option></select></div></div>`}).join('')||'<p class="mut">Belum ada item.</p>'}
<div class="row" style="margin-top:8px"><input type="number" placeholder="Diskon total" value="${tdisc||''}" onchange="tdisc=+this.value;draw()"><select class="fit" style="width:64px" onchange="tdt=this.value;draw()"><option value="rp">Rp</option><option value="%" ${tdt=='%'?'selected':''}>%</option></select><input type="number" placeholder="Ongkir" value="${ship||''}" onchange="ship=+this.value;draw()"></div>
<select onchange="cust=this.value;draw()"><option value="">Pelanggan umum</option>${db.customers.map(c=>`<option value="${c.id}" ${c.id==cust?'selected':''}>${E(c.name)}</option>`).join('')}</select>
<div class="row sp mut"><span>Subtotal</span><span style="text-align:right">${R(t.sub)}</span></div><div class="row sp mut"><span>Diskon</span><span style="text-align:right">-${R(t.td)}</span></div>${db.set.taxOn?`<div class="row sp mut"><span>Pajak ${db.set.tax}%</span><span style="text-align:right">${R(t.tax)}</span></div>`:''}
<div class="row sp"><span>Total</span><span class="tot" style="text-align:right">${R(t.total)}</span></div><button style="width:100%;margin-top:8px" onclick="pay()" ${cart.length?'':'disabled'}>Bayar</button></div></div>`}
let stream;async function cam(){if(!('BarcodeDetector' in window))return alert('Kamera scan belum didukung browser ini. Pakai scanner Bluetooth (mode keyboard) lalu scan ke kolom cari.');modal('<video id="vid" autoplay playsinline></video><button class="ghost" style="width:100%" onclick="closeM()">Tutup</button>');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#vid');v.srcObject=stream;const d=new BarcodeDetector();(async function l(){if(!stream)return;try{const r=await d.detect(v);if(r.length){const c=r[0].rawValue;closeM();return scan(c)}}catch(e){}setTimeout(l,300)})()}catch(e){alert('Kamera tidak bisa diakses.')}}
function stopCam(){stream&&stream.getTracks().forEach(t=>t.stop());stream=null}
function pay(){const t=calc();modal(`<h3>Bayar ${R(t.total)}</h3><label>Metode</label><select id="pm">${db.set.methods.map(m=>`<option>${E(m)}</option>`).join('')}</select><label>Jumlah dibayar</label><input id="pa" type="number" value="${Math.round(t.total)}"><div class="mut">Kurang dari total = sisa jadi piutang (wajib pilih pelanggan). Lebih = kembalian.</div><div class="row" style="margin-top:8px"><button class="ghost" onclick="closeM()">Batal</button><button onclick="done()">Selesaikan</button></div>`)}
function done(){const t=calc(),paid=+$('#pa').value||0,m=$('#pm').value,debt=Math.max(0,t.total-paid);if(debt>0&&!cust)return alert('Pilih pelanggan untuk mencatat piutang.');
const bad=cart.find(c=>c.qty>P(c.pid).stock);if(bad&&!confirm(P(bad.pid).name+' melebihi stok. Lanjutkan?'))return;
const s={id:nid(),no:'TRX'+String(db.sales.length+1).padStart(5,'0'),t:Date.now(),items:cart.map(c=>({pid:c.pid,name:P(c.pid).name,unit:P(c.pid).unit,qty:c.qty,price:price(P(c.pid),c.qty),cost:P(c.pid).cost,amt:line(c)})),...t,ship:+ship||0,method:m,paid:Math.min(paid,t.total),change:Math.max(0,paid-t.total),cust,debt,shift:db.shift&&db.shift.id};
cart.forEach(c=>{const p=P(c.pid);p.stock-=c.qty;db.stockLog.push({t:s.t,pid:p.id,d:-c.qty,note:s.no})});if(debt&&C(cust))C(cust).debt=(C(cust).debt||0)+debt;
db.sales.push(s);save();cart=[];tdisc=0;ship=0;cust='';showStruk(s)}
function struk(s){const w=db.set.paper==='80'?42:32,L=(a,b)=>a+' '.repeat(Math.max(1,w-a.length-b.length))+b,c=s.cust&&C(s.cust);
return [db.set.store,db.set.addr,'-'.repeat(w),s.no+'  '+new Date(s.t).toLocaleString('id-ID'),c?'Plg: '+c.name:'','-'.repeat(w),...s.items.map(i=>i.name+'\n'+L(' '+N(i.qty)+i.unit+' x '+N(i.price),N(i.amt))),'-'.repeat(w),L('Subtotal',N(s.sub)),s.td?L('Diskon','-'+N(s.td)):'',s.tax?L('Pajak',N(s.tax)):'',s.ship?L('Ongkir',N(s.ship)):'',L('TOTAL',N(s.total)),L(s.method,N(s.paid+s.change)),s.change?L('Kembali',N(s.change)):'',s.debt?L('Piutang',N(s.debt)):'','','Terima kasih'].filter(x=>x!=='').join('\n')}
function showStruk(s){window._s=struk(s);modal(`<h3>Transaksi selesai</h3><pre>${E(window._s)}</pre><div class="row"><button class="ghost" onclick="printS()">Cetak</button><button class="ghost" onclick="shareS()">Bagikan</button><button onclick="closeM();draw()">Tutup</button></div>`)}
function printS(){const w=window.open('','_blank');if(!w)return alert('Pop-up diblokir.');w.document.write(`<pre style="font:12px monospace;width:${db.set.paper==='80'?'80':'58'}mm">${E(window._s)}</pre>`);w.document.close();w.print()}
async function shareS(){try{navigator.share?await navigator.share({text:window._s}):(await navigator.clipboard.writeText(window._s),alert('Struk disalin.'))}catch(e){}}
/* ===== PRODUK ===== */
function vProduk(){const ex=db.products.filter(p=>p.exp&&(new Date(p.exp)-Date.now())/864e5<=7);
return `<div class="row sp"><h3>Produk & Stok</h3><button class="fit" onclick="fProd()">+ Produk</button><button class="fit ghost" onclick="csv()">Ekspor CSV</button><input type="file" accept=".csv" id="imp" hidden onchange="impCsv(this)"><button class="fit ghost" onclick="$('#imp').click()">Impor CSV</button></div>${ex.length?`<div class="card" style="border-color:var(--warn)">Kedaluwarsa ≤7 hari: ${ex.map(p=>E(p.name)+' ('+p.exp+')').join(', ')}</div>`:''}<div class="card tbl"><table><tr><th>Nama</th><th>Kategori</th><th>Harga</th><th>Stok</th><th></th></tr>${db.products.map(p=>`<tr><td>${E(p.name)}<div class="mut">${E(p.barcode)}</div></td><td>${E(p.cat)}</td><td>${R(p.price)}/${E(p.unit)}</td><td style="color:${p.stock<=5?'var(--bad)':''}">${N(p.stock)}</td><td><button class="sm ghost" onclick="fProd(${p.id})">Ubah</button> <button class="sm ghost" onclick="fStok(${p.id})">Stok</button></td></tr>`).join('')}</table></div>`}
function fProd(id){const p=id?P(id):{};form(id?'Ubah produk':'Produk baru',[['name','Nama','',p.name],['barcode','Barcode','',p.barcode],['cat','Kategori','',p.cat],['unit','Satuan (pcs/kg/lusin/m)','',p.unit||'pcs'],['price','Harga jual','type=number',p.price],['cost','Harga beli','type=number',p.cost],['stock','Stok (boleh desimal)','type=number step=any',p.stock||0],['exp','Kedaluwarsa','type=date',p.exp],['tiers','Harga grosir (min:harga, pisah koma) mis. 10:13000,50:12000','',p.tiers]],v=>{if(!v.name)return;Object.assign(p,v,{price:+v.price,cost:+v.cost,stock:+v.stock});if(!id){p.id=nid();db.products.push(p)}save();draw()})}
function fStok(id){const p=P(id);form('Stok '+p.name,[['d','Tambah/kurangi (mis. 10 atau -2)','type=number step=any',0],['n','Catatan','','Penyesuaian']],v=>{p.stock+=+v.d;db.stockLog.push({t:Date.now(),pid:id,d:+v.d,note:v.n});save();draw()},`<div class="mut" style="margin-bottom:8px">Riwayat: ${db.stockLog.filter(l=>l.pid==id).slice(-4).reverse().map(l=>`${new Date(l.t).toLocaleDateString('id-ID')} ${l.d>0?'+':''}${N(l.d)}`).join(' | ')||'-'}</div>`)}
function csv(){const t='nama,barcode,kategori,satuan,harga,beli,stok,exp\n'+db.products.map(p=>[p.name,p.barcode,p.cat,p.unit,p.price,p.cost,p.stock,p.exp].join(',')).join('\n');dl('produk.csv',t)}
function dl(n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=n;a.click()}
/* ===== PELANGGAN ===== */
function rfm(c){const s=db.sales.filter(x=>x.cust==c.id);if(!s.length)return'Baru';const d=(Date.now()-Math.max(...s.map(x=>x.t)))/864e5;return d>30?'At-Risk':d<=7&&s.length>=5?'Champion':s.length>=3?'Loyal':'Potensial'}
function vCust(){return `<div class="row sp"><h3>Pelanggan</h3><button class="fit" onclick="fCust()">+ Pelanggan</button></div>${db.customers.map(c=>{const s=db.sales.filter(x=>x.cust==c.id);return `<div class="card"><div class="row sp"><b>${E(c.name)}</b><span class="tag fit">${rfm(c)}</span></div><div class="mut">${E(c.phone||'')} · ${s.length} transaksi · ${R(s.reduce((a,x)=>a+x.total,0))}</div><div class="row sp"><span style="color:${c.debt?'var(--bad)':''}">Piutang ${R(c.debt||0)}</span>${c.debt?`<button class="sm fit" onclick="payDebt(${c.id})">Lunasi</button>`:''}</div></div>`}).join('')||'<p class="mut">Belum ada pelanggan.</p>'}`}
function fCust(){form('Pelanggan baru',[['name','Nama'],['phone','No. HP']],v=>{if(!v.name)return;db.customers.push({id:nid(),name:v.name,phone:v.phone,debt:0});save();draw()})}
function payDebt(id){const c=C(id);form('Pelunasan '+c.name,[['a','Jumlah bayar (sisa '+R(c.debt)+')','type=number',c.debt]],v=>{c.debt=Math.max(0,c.debt-(+v.a||0));db.sales.push({id:nid(),no:'PIUTANG',t:Date.now(),items:[],sub:0,td:0,tax:0,ship:0,total:0,paid:0,method:'Pelunasan',cust:id,debt:0,payoff:+v.a||0});save();draw()})}
/* ===== BIAYA & SHIFT ===== */
function vBiaya(){const sh=db.shift,ex=db.expenses.slice().reverse();return `<div class="card"><h3>Shift kasir</h3>${sh?`<p>Shift dibuka ${new Date(sh.t).toLocaleTimeString('id-ID')}, kas awal ${R(sh.open)}</p><button onclick="closeShift()">Tutup shift</button>`:`<button onclick="openShift()">Buka shift</button>`}<div class="mut" style="margin-top:6px">${db.shifts.slice(-3).reverse().map(s=>`${new Date(s.t).toLocaleDateString('id-ID')}: tunai seharusnya ${R(s.expect)}, hitung ${R(s.count)}, selisih ${R(s.count-s.expect)}`).join('<br>')}</div></div>
<div class="row sp"><h3>Pengeluaran</h3><button class="fit" onclick="fExp()">+ Catat</button></div><div class="card tbl"><table>${ex.map(e=>`<tr><td>${new Date(e.t).toLocaleDateString('id-ID')}</td><td>${E(e.name)}</td><td>${E(e.cat)}</td><td>${R(e.amt)}</td></tr>`).join('')||'<tr><td class="mut">Belum ada pengeluaran.</td></tr>'}</table></div>`}
function fExp(){form('Pengeluaran',[['name','Keterangan'],['cat','Kategori (listrik, gaji, dll)'],['amt','Jumlah','type=number']],v=>{if(!+v.amt)return;db.expenses.push({t:Date.now(),name:v.name,cat:v.cat,amt:+v.amt});save();draw()})}
function openShift(){form('Buka shift',[['o','Kas awal','type=number',0]],v=>{db.shift={id:nid(),t:Date.now(),open:+v.o};save();draw()})}
function closeShift(){const sh=db.shift,cash=db.sales.filter(s=>s.shift==sh.id&&s.method=='Tunai').reduce((a,s)=>a+s.total-s.debt,0),ex=db.expenses.filter(e=>e.t>=sh.t).reduce((a,e)=>a+e.amt,0),expect=sh.open+cash-ex;form('Tutup shift',[['c','Uang tunai di laci (seharusnya '+R(expect)+')','type=number',expect]],v=>{db.shifts.push({t:sh.t,expect,count:+v.c});db.shift=null;save();draw()})}
/* ===== LAPORAN ===== */
function vLap(){const from=rp=='all'?0:Date.now()-rp*864e5,S=db.sales.filter(s=>s.t>=from&&s.no!='PIUTANG'&&!s.ret),X=db.expenses.filter(e=>e.t>=from),om=S.reduce((a,s)=>a+s.total,0),hpp=S.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.cost*i.qty,0),0),tax=S.reduce((a,s)=>a+s.tax,0),ex=X.reduce((a,e)=>a+e.amt,0),gp=om-tax-hpp,by={},pm={};
S.forEach(s=>{pm[s.method]=(pm[s.method]||0)+s.total;s.items.forEach(i=>{by[i.name]=by[i.name]||{q:0,a:0};by[i.name].q+=i.qty;by[i.name].a+=i.amt})});const top=Object.entries(by).sort((a,b)=>b[1].a-a[1].a).slice(0,10),ar=db.customers.reduce((a,c)=>a+(c.debt||0),0),k=[['Omzet',om],['Transaksi',S.length,1],['HPP',hpp],['Laba kotor',gp],['Pengeluaran',ex],['Laba bersih',gp-ex],['Piutang',ar],['Rata-rata/trx',S.length?om/S.length:0]];
return `<div class="row sp"><h3>Laporan</h3><select class="fit" style="width:auto" onchange="rp=this.value;draw()">${[['1','Hari ini'],['7','7 hari'],['30','30 hari'],['all','Semua']].map(o=>`<option value="${o[0]}" ${o[0]==rp?'selected':''}>${o[1]}</option>`).join('')}</select></div><div class="grid">${k.map(x=>`<div class="card"><div class="mut">${x[0]}</div><b style="font-size:16px">${x[2]?x[1]:R(x[1])}</b></div>`).join('')}</div>
<div class="card"><b>Per metode bayar</b>${Object.entries(pm).map(([m,v])=>`<div class="row sp"><span>${E(m)}</span><span style="text-align:right">${R(v)}</span></div>`).join('')||'<div class="mut">Belum ada data.</div>'}</div>
<div class="card tbl"><b>10 produk terlaris</b><table>${top.map(([n,v])=>`<tr><td>${E(n)}</td><td>${N(v.q)}</td><td>${R(v.a)}</td></tr>`).join('')}</table></div>
<div class="card tbl"><b>Riwayat transaksi</b><table>${S.slice(-15).reverse().map(s=>`<tr><td>${s.no}</td><td>${new Date(s.t).toLocaleString('id-ID')}</td><td>${E(s.method)}</td><td>${R(s.total)}</td><td><button class="sm ghost" onclick="retur(${s.id})">Retur</button></td></tr>`).join('')}</table></div>`}
/* ===== SETELAN ===== */
function vSet(){const s=db.set;return `<div class="card"><h3>Toko</h3><label>Nama<input value="${E(s.store)}" onchange="db.set.store=this.value;save()"></label><label>Alamat<input value="${E(s.addr)}" onchange="db.set.addr=this.value;save()"></label><label>PIN kunci aplikasi (kosong = mati)<input value="${E(s.pin||'')}" onchange="db.set.pin=this.value;save()"></label><div class="row"><label>Pajak %<input type="number" value="${s.tax}" onchange="db.set.tax=+this.value;save()"></label><label>Pajak otomatis<select onchange="db.set.taxOn=this.value=='1';save()"><option value="1" ${s.taxOn?'selected':''}>Aktif</option><option value="0" ${s.taxOn?'':'selected'}>Mati</option></select></label><label>Kertas struk<select onchange="db.set.paper=this.value;save()"><option>58</option><option ${s.paper=='80'?'selected':''}>80</option></select></label></div></div>
<div class="card"><h3>Metode pembayaran</h3><div>${s.methods.map((m,i)=>`<span class="tag">${E(m)} <a href="#" onclick="db.set.methods.splice(${i},1);save();draw();return false">×</a></span> `).join('')}</div><button class="sm" style="margin-top:8px" onclick="const m=prompt('Nama metode (mis. Kartu Debit)');if(m){db.set.methods.push(m);save();draw()}">+ Metode</button></div>
<div class="card"><h3>Data</h3><button class="ghost" onclick="if(confirm('Hapus semua data & kembali ke contoh?')){localStorage.removeItem('kasir');db=seed();draw()}">Reset data</button></div>`}
/* ===== PROMO ===== */
function promoD(sub){let d=0;(db.promos||[]).forEach(p=>{if(p.type=='min'&&sub>=p.min)d=Math.max(d,p.disc);if(p.type=='bx'){const c=cart.find(c=>c.pid==p.pid);if(c)d+=Math.floor(c.qty/(p.buy+p.free))*p.free*price(P(p.pid),c.qty)}});return d}
function vPromo(){const l=db.promos=db.promos||[];return `<div class="row sp"><h3>Promo</h3><button class="fit" onclick="fPmin()">+ Tebus Murah</button><button class="fit" onclick="fPbx()">+ Beli X Gratis Y</button></div><div class="card">${l.map((p,i)=>`<div class="row sp"><span>${p.type=='min'?`Belanja min ${R(p.min)} diskon ${R(p.disc)}`:`Beli ${p.buy} ${E(P(p.pid)?.name)} gratis ${p.free}`}</span><button class="fit sm bad" onclick="db.promos.splice(${i},1);save();draw()">Hapus</button></div>`).join('')||'<span class="mut">Belum ada promo. Harga bertingkat per qty diatur di form produk.</span>'}</div>`}
function fPmin(){form('Tebus Murah',[['m','Minimal belanja','type=number'],['d','Diskon (Rp)','type=number']],v=>{db.promos.push({type:'min',min:+v.m,disc:+v.d});save();draw()})}
function fPbx(){form('Beli X Gratis Y',[['b','Barcode produk'],['x','Beli (qty)','type=number'],['y','Gratis (qty)','type=number']],v=>{const p=db.products.find(p=>p.barcode==v.b);if(!p)return alert('Barcode tidak ditemukan');db.promos.push({type:'bx',pid:p.id,buy:+v.x,free:+v.y});save();draw()})}
/* ===== SUPPLIER & PEMBELIAN ===== */
function vSup(){const sp=db.sups=db.sups||[],po=db.pos=db.pos||[];return `<div class="row sp"><h3>Supplier & Pembelian</h3><button class="fit ghost" onclick="fSup()">+ Supplier</button><button class="fit" onclick="fPO()">+ Purchase Order</button></div><div class="card">${sp.map(s=>`<span class="tag">${E(s.name)} ${E(s.phone||'')}</span> `).join('')||'<span class="mut">Belum ada supplier.</span>'}</div><div class="card tbl"><table><tr><th>PO</th><th>Supplier</th><th>Total</th><th>Dibayar</th><th>Status</th><th></th></tr>${po.slice().reverse().map(o=>`<tr><td>${o.no}</td><td>${E(sp.find(s=>s.id==o.sup)?.name||'-')}</td><td>${R(o.total)}</td><td>${R(o.paid)}</td><td>${o.recv?'Diterima':'Dipesan'}</td><td>${o.recv?'':`<button class="sm" onclick="recvPO(${o.id})">Terima</button> `}${o.paid<o.total?`<button class="sm ghost" onclick="payPO(${o.id})">Bayar</button>`:''}</td></tr>`).join('')}</table></div><div class="card tbl"><b>Riwayat harga beli</b><table>${db.products.filter(p=>p.hist).map(p=>`<tr><td>${E(p.name)}</td><td>${p.hist.slice(-4).map(h=>new Date(h.t).toLocaleDateString('id-ID')+' '+R(h.cost)).join(' | ')}</td></tr>`).join('')}</table></div>`}
function fSup(){form('Supplier baru',[['name','Nama'],['phone','No. HP']],v=>{if(v.name){db.sups.push({id:nid(),...v});save();draw()}})}
function fPO(){form('Purchase Order',[['sup','Nama supplier'],['items','Item: barcode:qty:harga beli, ... (mis. 8990001:20:8000)']],v=>{const items=v.items.split(',').map(x=>x.trim().split(':')).map(([b,q,c])=>({pid:(db.products.find(p=>p.barcode==b)||{}).id,qty:+q,cost:+c})).filter(i=>i.pid&&i.qty);if(!items.length||!v.sup)return alert('Data PO tidak valid');let s=db.sups.find(x=>x.name==v.sup);if(!s){s={id:nid(),name:v.sup};db.sups.push(s)}db.pos.push({id:nid(),no:'PO'+(db.pos.length+1),sup:s.id,items,total:items.reduce((a,i)=>a+i.qty*i.cost,0),paid:0,recv:false,t:Date.now()});save();draw()})}
function recvPO(id){const o=db.pos.find(o=>o.id==id);o.items.forEach(i=>{const p=P(i.pid);p.stock+=i.qty;p.cost=i.cost;(p.hist=p.hist||[]).push({t:Date.now(),cost:i.cost});db.stockLog.push({t:Date.now(),pid:p.id,d:i.qty,note:o.no})});o.recv=true;save();draw()}
function payPO(id){const o=db.pos.find(o=>o.id==id);form('Bayar '+o.no,[['a','Jumlah (sisa '+R(o.total-o.paid)+')','type=number',o.total-o.paid]],v=>{o.paid=Math.min(o.total,o.paid+(+v.a||0));save();draw()})}
/* ===== PRE-ORDER ===== */
function vPre(){const l=db.preorders=db.preorders||[];return `<div class="row sp"><h3>Pre-Order</h3><button class="fit" onclick="fPre()">+ Catat PO</button></div><div class="card tbl"><table><tr><th>Pelanggan</th><th>Pesanan</th><th>Ambil</th><th>Total</th><th>DP</th><th></th></tr>${l.slice().reverse().map(o=>`<tr><td>${E(o.name)}</td><td>${E(o.item)}</td><td>${E(o.date)}</td><td>${R(o.total)}</td><td>${R(o.dp)}</td><td>${o.done?'Lunas':`<button class="sm" onclick="donePre(${o.id})">Lunasi</button>`} <button class="sm ghost" onclick="notaPre(${o.id})">Nota</button></td></tr>`).join('')||'<tr><td class="mut">Belum ada pre-order.</td></tr>'}</table></div>`}
function fPre(){form('Catat Pre-Order',[['name','Pelanggan'],['item','Pesanan'],['date','Jadwal ambil','type=date'],['total','Total','type=number'],['dp','DP','type=number',0]],v=>{if(!v.name||!+v.total)return;db.preorders.push({id:nid(),name:v.name,item:v.item,date:v.date,total:+v.total,dp:+v.dp,done:false});save();draw()})}
function donePre(id){const o=db.preorders.find(o=>o.id==id);o.done=true;db.sales.push({id:nid(),no:'PRE'+String(db.sales.length+1).padStart(5,'0'),t:Date.now(),items:[{pid:0,name:o.item,unit:'',qty:1,price:o.total,cost:0,amt:o.total}],sub:o.total,td:0,tax:0,ship:0,total:o.total,paid:o.total,change:0,method:db.set.methods[0],cust:'',debt:0});save();draw()}
function notaPre(id){const o=db.preorders.find(o=>o.id==id);window._s=[db.set.store,'NOTA PRE-ORDER','-'.repeat(32),'Pelanggan: '+o.name,'Pesanan  : '+o.item,'Ambil    : '+o.date,'Total    : '+N(o.total),'DP       : '+N(o.dp),'Sisa     : '+N(o.done?0:o.total-o.dp)].join('\n');modal(`<h3>Nota</h3><pre>${E(window._s)}</pre><div class="row"><button class="ghost" onclick="printS()">Cetak</button><button class="ghost" onclick="shareS()">Bagikan</button><button onclick="closeM()">Tutup</button></div>`)}
/* ===== RETUR & IMPOR ===== */
function retur(id){const s=db.sales.find(s=>s.id==id);if(!confirm('Retur transaksi '+s.no+'? Stok dikembalikan.'))return;s.ret=true;s.items.forEach(i=>{const p=P(i.pid);if(p){p.stock+=i.qty;db.stockLog.push({t:Date.now(),pid:p.id,d:i.qty,note:'Retur '+s.no})}});if(s.debt&&C(s.cust))C(s.cust).debt=Math.max(0,C(s.cust).debt-s.debt);save();draw()}
function impCsv(el){const f=el.files[0];if(!f)return;f.text().then(t=>{t.trim().split(/\r?\n/).slice(1).forEach(l=>{const [name,barcode,cat,unit,price,cost,stock,exp]=l.split(',');if(!name)return;const p=db.products.find(p=>p.barcode&&p.barcode==barcode)||(db.products.push({id:nid(),tiers:''}),db.products[db.products.length-1]);Object.assign(p,{name,barcode,cat,unit:unit||'pcs',price:+price||0,cost:+cost||0,stock:+stock||0,exp:exp||''})});save();draw()})}
document.addEventListener('keydown',e=>{if(e.key=='F2'&&tab=='kasir'&&cart.length){e.preventDefault();pay()}if(e.key=='Escape')closeM()});
if(db.set.pin&&prompt('Masukkan PIN')!==db.set.pin){document.body.innerHTML='<p style="padding:20px">Terkunci. Muat ulang untuk mencoba lagi.</p>';throw 0}
draw();
</script></body></html>
